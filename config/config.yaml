# Goyang Changneung Building Change Intelligence PoC - 분석 파라미터
# 실제 데이터 확보 전까지는 값을 확정하지 않는다. TBD 표시된 항목은
# 원본 데이터 검토(Phase 1/2) 이후 근거를 기록하고 채운다.

project:
  name: "Goyang Changneung Building Change Intelligence PoC"
  t1_year: 2022
  t2_year: 2024

satellite:
  # 1차 자동화 영상 소스: Sentinel-2 L2A (Microsoft Planetary Computer STAC)
  # NGII 고해상 정사영상은 GUI 전용이라 자동화 불가 - 병행 수동 확보 트랙으로 별도 관리.
  provider: "planetary-computer"
  collection: "sentinel-2-l2a"
  bands: ["B02", "B03", "B04", "B08"]  # Blue/Green/Red/NIR, 10m
  max_cloud_cover_pct: 20
  t1_date_range: "2022-01-01/2022-12-31"
  t2_date_range: "2024-01-01/2024-12-31"
  # 장면 "검색"용 범위: 실제 AOI(창릉동 행정동, data/aoi/changneung_test_aoi.gpkg)
  # 경계를 +-0.02도(~2km) 버퍼한 값. 최종 clip은 반드시 AOI 폴리곤 자체로 수행한다.
  search_bbox_wgs84: [126.8525653, 37.5904702, 126.9324672, 37.6714563]
  known_limitation: >
    10m 해상도로 개별 단독주택 단위 신축/증축 탐지는 어려움. 대형 아파트단지/
    대규모 토지조성 등 큰 변화 위주로 검증 후 SkyWatch Benchmark에서
    고해상 상용영상과 비교한다.

crs:
  # AOI(행정동 경계)는 EPSG:4326(WGS84)으로 배포됨 -> 분석은 투영좌표계로 통일.
  source_crs: "EPSG:4326"
  analysis_crs: "EPSG:5186"
  decision_note: >
    EPSG:5186 (Korea 2000 / Central Belt 2010, 중부원점, 중앙자오선 127E)을 선택.
    창릉 AOI 경도범위(126.87~126.91E)가 중부원점 적용범위(125.5~128.5E)에 들어가며,
    국내 서울/경기 지역 공공 GIS 데이터에서 가장 널리 쓰이는 표준 투영좌표계이기 때문.
    Sentinel-2 등 위성영상(UTM, EPSG:326xx)이나 NGII 정사영상의 원본 CRS는 확보 후
    별도로 확인해 이 좌표계로 재투영한다.

alignment:
  method: "ECC"              # ORB | SIFT | ECC | phase_correlation 중 실험 후 결정
  max_allowed_rmse_m: null   # TBD - AOI 해상도 확인 후 결정

change_detection:
  methods: ["pixel_diff", "ssim", "edge_texture", "ensemble"]
  min_area_thresholds_m2: [10, 25, 50, 100]

postprocess:
  morphology:
    opening_kernel: 3
    closing_kernel: 3
  min_component_area_m2: 25   # config 값 - 실험으로 조정

classification:
  buffer_distances_m: [3, 5]
  change_ratio_new_building_min: 0.5   # TBD - 실데이터로 캘리브레이션 필요

priority_scoring:
  weights:
    change_confidence: 0.40
    change_ratio: 0.30
    administrative_uncertainty: 0.20
    building_relevance: 0.10
  thresholds:
    high: 0.7
    medium: 0.4

validation_sample:
  high_n: 50
  medium_n: 30
  low_n: 20
