# Goyang Changneung Building Change Intelligence PoC - 분석 파라미터
# 실제 데이터 확보 전까지는 값을 확정하지 않는다. TBD 표시된 항목은
# 원본 데이터 검토(Phase 1/2) 이후 근거를 기록하고 채운다.

project:
  name: "Goyang Changneung Building Change Intelligence PoC"
  t1_year: 2022
  t2_year: 2024

satellite:
  # 1차 자동화 영상 소스: Sentinel-2 L2A (Microsoft Planetary Computer STAC)
  # NGII 고해상 정사영상은 GUI 전용이라 자동화 불가 - 병행 수동 확보 트랙으로 별도 관리.
  provider: "planetary-computer"
  collection: "sentinel-2-l2a"
  bands: ["B02", "B03", "B04", "B08"]  # Blue/Green/Red/NIR, 10m
  max_cloud_cover_pct: 20
  t1_date_range: "2022-01-01/2022-12-31"
  t2_date_range: "2024-01-01/2024-12-31"
  # 장면 "검색"용 범위: 실제 AOI(창릉동 행정동, data/aoi/changneung_test_aoi.gpkg)
  # 경계를 +-0.02도(~2km) 버퍼한 값. 최종 clip은 반드시 AOI 폴리곤 자체로 수행한다.
  search_bbox_wgs84: [126.8525653, 37.5904702, 126.9324672, 37.6714563]
  known_limitation: >
    10m 해상도로 개별 단독주택 단위 신축/증축 탐지는 어려움. 대형 아파트단지/
    대규모 토지조성 등 큰 변화 위주로 검증 후 SkyWatch Benchmark에서
    고해상 상용영상과 비교한다.

crs:
  # AOI(행정동 경계)는 EPSG:4326(WGS84)으로 배포됨 -> 분석은 투영좌표계로 통일.
  source_crs: "EPSG:4326"
  analysis_crs: "EPSG:5186"
  decision_note: >
    EPSG:5186 (Korea 2000 / Central Belt 2010, 중부원점, 중앙자오선 127E)을 선택.
    창릉 AOI 경도범위(126.87~126.91E)가 중부원점 적용범위(125.5~128.5E)에 들어가며,
    국내 서울/경기 지역 공공 GIS 데이터에서 가장 널리 쓰이는 표준 투영좌표계이기 때문.
    Sentinel-2 실측 확인: EPSG:32652 (WGS 84 / UTM zone 52N), 10m, uint16, nodata=0.
    Raster Preprocessing 단계에서 EPSG:5186으로 재투영한다. NGII 정사영상은
    확보 후 별도로 원본 CRS를 확인한다.

alignment:
  method: "ECC"              # 실측 확인: T1/T2 displacement=1.26m, ecc_score=0.979 (2022-05-17 vs 2024-05-31)
  max_allowed_rmse_m: 10.0   # 1 픽셀(10m) 기준. 실측값(1.26m)은 이 기준을 충분히 만족.

change_detection:
  # robust_cva: solafune-sentinel2-change 차용 - 밴드별 median/MAD 표준화 후
  # 유클리드 결합 + percentile 정규화. pixel_diff(전역 max 정규화, 극단 픽셀
  # 하나에 취약)를 대체. ssim/edge_texture는 기존과 동일.
  methods: ["robust_cva", "ssim", "edge_texture", "ensemble"]
  min_area_thresholds_m2: [10, 25, 50, 100]
  # otsu: change_probability 분포(AOI 유효 픽셀만)에서 임계값을 자동 산정.
  # fixed로 바꾸면 mask_threshold 고정값을 쓴다.
  threshold_method: "fixed"
  mask_threshold: 0.5   # threshold_method=fixed일 때, 또는 otsu 계산 불가 시 fallback

postprocess:
  morphology:
    opening_kernel: 3
    closing_kernel: 3
  min_component_area_m2: 25   # config 값 - 실험으로 조정

# solafune-sentinel2-change의 Global Moran's I / Getis-Ord Gi* 차용.
# building_change_results의 priority_score가 공간적으로 군집되어 있는지
# (=산발적 노이즈가 아니라 실제 구조화된 변화인지) 통계적으로 검증하고,
# 어느 건물들이 유의한 hotspot에 속하는지 표시한다.
spatial_statistics:
  k: 8              # KNN 이웃 수 (Moran's I는 row-standardized, Gi*는 binary weights)
  permutations: 999 # permutation 검정 반복 횟수

random_seed: 42   # 공간통계 permutation 등 확률적 단계의 재현성용 (run_manifest.json에 기록)

classification:
  buffer_distances_m: [3, 5]
  change_ratio_new_building_min: 0.5   # TBD - 실데이터로 캘리브레이션 필요

priority_scoring:
  weights:
    change_confidence: 0.40
    change_ratio: 0.30
    administrative_uncertainty: 0.20
    building_relevance: 0.10
  thresholds:
    high: 0.7
    medium: 0.4

validation_sample:
  high_n: 50
  medium_n: 30
  low_n: 20

# --- 아래는 LH 요구사항(config/lh_requirements.yaml) 반영을 위해
# src/arcpy_pipeline/*가 사용하는 파라미터다. Baseline(src/*)은 사용하지 않는다.

compensation:
  # 보상 기준일(통상 공람공고일). 반드시 사업부서가 확정한 실제 날짜로
  # 채워야 한다 - 이 값이 틀리면 compensation_status 전체가 무효가 된다.
  # PoC 단계에서는 예시로 비워둔다: null이면 pipeline.py가 보상기준일 판정
  # 단계(REQ03)를 건너뛰고 그 사실을 lh_traceability.md에 기록한다.
  baseline_date: null   # 예: "2023-06-01"

illegal_screening:
  # 실제 footprint / 대장 건축면적 이 값을 넘으면 면적초과 신호로 본다.
  # footprint 정의 차이·대장 1:다 대응 오차를 흡수하기 위해 넉넉히 잡음.
  tolerance_ratio: 1.3
  strong_change_ratio: 0.5
  strong_confidence: 0.6

progress_monitor:
  grid_cell_size_m: 250.0
  site_persistence_distance_m: 30.0

imagery_tasking:
  # search_bbox_wgs84와 동일 - 아카이브 조회/최신영상 확인용 "검색" 범위.
  recent_days_window: 90
  season_months: [4, 6]   # 계절 일치 비교를 위한 월 범위 (4~6월)

field_survey:
  buffer_m_for_near_change: 3.0

reality_3d:
  review_buffer_m: 20.0
  floor_height_m: 3.0
  target_gsd_cm: 3.0
  overlap_pct: 75

arcgis_pro:
  # arcpy 파이프라인 산출물 저장 위치 (Baseline의 outputs/*.gpkg 대신 FileGDB).
  output_gdb: outputs/arcgis/changneung.gdb
  # report_builder.py가 재사용할 빈 프로젝트 템플릿 - 최초 1회 사람이 준비.
  template_aprx: outputs/arcgis/templates/blank_template.aprx
