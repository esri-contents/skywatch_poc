  id: gwangmyeong_siheung_aerial
  name: "광명시흥 공공주택지구 항공사진 기반 변화탐지 PoC (항공 정사영상, 2022-12 vs 2024)"
  short_name: "광명시흥"
  official_name: "광명시흥 공공주택지구"
  location: "경기도 광명시 광명동·옥길동·가학동·노온사동, 시흥시 과림동·무지내동·금이동 일원"
  official_area_m2: null  # 언론보도 "1,271만㎡"는 미검증 참고치 - area_m2_calc(VWorld 실측 폴리곤 면적)로 대체
  operator: "한국토지주택공사(LH) · 경기주택도시공사(GH) 공동 시행"
  analysis_crs: "EPSG:5186"

