aoi:
  status: official
  provider: "VWorld WFS"
  layer: "lt_c_lhzone"
  zonecode: "41210LH2022002"
  zonename: "광명시흥 공공주택지구"
  source_url: "https://api.vworld.kr/req/wfs"
  designation_notice_url: "https://eum.go.kr/web/gs/gv/gvGosiDet.jsp?seq=540298"
  designation_notice_number: "국토교통부 고시 제2022-673호"
  designation_notice_date: "2022-11-29"
  note: >
    2026-09-17 실측 확인: VWorld lt_c_lhzone에서 zonecode=41210LH2022002,
    zonename="광명시흥 공공주택지구"(cat_cde=RA, 실시계획 단계) 1건을 확보했다.
    계산면적(EPSG:5186) 12,714,465.76㎡로, 언론에 보도된 지구지정 당시 면적
    "1,271만㎡"(12,710,000㎡)와 4,466㎡(0.035%) 차이 - 같은 지구를 가리킨다는
    정황과 일치한다. WFS가 서비스하는 경계는 이후 변경고시(아래)가 반영된
    최신본일 가능성이 있어, 최초 고시(2022-11-29) 시점 경계와 완전히 같다고
    단정하지 않는다. 이후 변경 이력(WebSearch 2차 자료 기준, 원문 미확보):
    국토교통부 고시 제2023-396호(2023-07-11, 지구지정 변경(1차) - 집단취락지역
    제척), 국토교통부 고시 제2024-875호(2024-12-30, 지구지정 변경(2차) 및
    지구계획 승인). designation_notice_*는 최초 지정고시 기준으로 기재했다 -
    고시 원문 PDF는 직접 확보/전문검색하지 못했다(eum.go.kr 상세페이지
    WebFetch 요약만 반영, 미검증).

imagery:
  # Sentinel-2 STAC 대신 사용자가 제공한 로컬 항공 정사영상(RGB)을 쓴다.
  # source=local이면 project_acquisition은 영상 다운로드를 건너뛰고,
  # project_pipeline.preprocess는 각 epoch의 path를 align_imagery_pair로
  # AOI 공통 grid(analysis_crs, resolution_m)에 정렬한다.
  source: local
  provider: "로컬 항공 정사영상 (data/data_261026, 2026-10-26 수령)"
  sensor_label: "항공 정사영상"
  band_order: ["red", "green", "blue"]
  resolution_m: 1.0
  epochs:
    - id: t0
      date: "2022-12-01"
      item_id: "aerial_20221201"
      path: "data/projects/gwangmyeong_siheung_aerial/raw/imagery/aerial_20221201_0.25m.tif"
      original: "data/data_261026/항공사진_20221201/광명시흥 공공주택지구.ecw"
      role: "T1(2022-12-01) - 원본 ECW 3.8cm RGB, 원좌표 EPSG:5186(.ecw.xml nativeExtBox).
        aux.xml의 ArcMap PolynomialXform(EPSG:5174 이동)은 무시하고 원좌표로 0.25m
        GeoTIFF 변환. 지구지정고시일(2022-11-29) 이틀 뒤 촬영으로 보상 기준 시점 현황에 해당."
    - id: t2
      date: "2024"
      item_id: "aerial_2024"
      path: "data/projects/gwangmyeong_siheung_aerial/raw/imagery/aerial_2024_0.25m_georef.tif"
      original: "data/data_261026/GRS80_0.25m(2024).jpg"
      role: "T2(2024, 촬영 월일 미상 - 파일명에 연도만 있음) - 원본 JPG 0.25m RGB, 좌표정보
        없음. 2022 ECW 기준 SIFT(2m)+타일 위상상관(0.25m)으로 지오레퍼런싱
        (EPSG:5186, RMSE 0.42m, 중앙값 0.29m, 262개 타일) -
        raw/imagery/georef_2024_report.json 참고. 수목 낙엽 상태로 보아 동절기~초봄 촬영 추정."
  selection_note: >
    Sentinel-2(10m) 원 프로젝트(gwangmyeong_siheung)와 같은 AOI·같은 분석 로직을
    항공 정사영상으로 반복해 해상도 차이에 따른 결과 차이를 비교한다. 분석
    해상도 1.0m는 두 영상(0.25m)을 4x4 평균한 값이다. 2026-10-26 0.5m(7203x15234)
    실행은 baseline 변화탐지가 AOI 전체를 float64로 메모리에 올리는 구조라
    robust CVA 단계에서 메모리 할당에 실패했다(commit 여유 6.7GB) - 타일 처리 없이
    전 AOI를 처리할 수 있는 1.0m로 정했다(100㎡ 건물 = 100픽셀). 2024 영상 좌표는
    2022 ECW에 상대적으로 맞춘 값이라 절대위치 정확도는 2022 ECW에 종속된다.

compensation:
  # 아래 baseline_date는 "지구지정을 위한 주민공람공고일"이 원칙(대법원 취지,
  # hwaseong_jinan 조사에서 확인)이나, 이번 조사에서는 지구지정고시일까지만
  # 확인했다 - 사업부서 확인 전까지 잠정값이다.
  baseline_date: "2022-11-29"
  baseline_type: "지구지정 및 지형도면 등의 고시일(국토교통부고시 제2022-673호) -
    이 지구는 이미 보상계획공고 단계까지 진행되어(아래 note) 실제
    이주대책기준일/권리산정기준일이 보상계획공고문에 명시돼 있을 가능성이
    높으나, 이번 조사에서는 그 원문을 직접 확인하지 못해 지구지정고시일을
    잠정값으로 사용한다. [미확정 잠정값]"
  source_url: "https://eum.go.kr/web/gs/gv/gvGosiDet.jsp?seq=540298"
  business_confirmed: false
  interim_use_approved: true
  interim_use_note: >
    2026-09-17 WebSearch(2차 자료, 원문 미확보) 기준 추진경위: 2021-02-24
    3기 신도시 신규 후보지 발표 -> 2022-11-29 지구지정 및 지형도면 고시
    (국토교통부고시 제2022-673호) -> 2023-07-11 지구지정 변경(1차, 집단취락지역
    제척, 제2023-396호) -> 2024-12-30 지구지정 변경(2차) 및 지구계획 승인
    (제2024-875호) -> 2025-08-27 토지·물건 보상계획 및 열람 공고(1차) ->
    2026-07-31 보상계획 및 열람 공고(2차). 즉 하남진안/제주김녕과 달리 이미
    보상계획공고까지 실제로 진행된 사업이다 - LH·GH 공고문 원문(보상계획공고
    PDF)에 이주대책기준일/권리산정기준일이 명시돼 있을 가능성이 높지만, 이번
    조사에서는 뉴스 2차 보도까지만 확인했고 그 공고문 원문을 직접 열어보지
    못했다. business_confirmed를 true로 바꾸려면 GH(gh.or.kr)/LH(lh.or.kr)
    보상계획공고 원문에서 이주대책기준일 조항을 직접 확인해야 한다.
  open_questions_for_business_team:
    - "2025-08-27(1차)/2026-07-31(2차) 보상계획 및 열람 공고 원문에 이주대책
      기준일 또는 권리산정기준일이 명시되어 있는가? 명시되어 있다면 그 날짜로
      baseline_date를 교체해야 한다."
    - "2023-07-11 집단취락지역 제척(1차 변경)으로 AOI 경계가 바뀌었는가?
      VWorld가 서비스하는 현재 경계가 어느 시점 기준인지 사업부서 확인 필요."

analysis:
  base_config: "config/config.yaml"
  change_ratio_new_building_min: 0.5
  threshold_candidates: [0.3, 0.4, 0.5, 0.6, 0.7, 0.8]
  comparison_pairs:
    - [t0, t2]
  # 1m 항공사진 보정 (2026-10-26 실험, 근거: outputs/.../reports/aerial_calibration.md).
  # 기본값(앙상블>=0.5, 최소 25㎡) 그대로면 SSIM이 미세 질감 차이로 AOI 절반 이상을
  # 변화로 잡아 후보 9,878건. robust CVA>=0.5(분광 변화 동반)를 추가 조건으로 둬
  # 인허가 대용 정답 필지 재현(4/7)은 유지하고 2020년 이전 건물 오탐 대용률은
  # 7.7%->2.3%로 낮췄다. 최소면적 50㎡ 상향/그림자(밝기<45) 제외는 66㎡ 소형
  # 신축 완공 필지를 놓쳐 채택하지 않았다. 히스토그램 매칭은 효과가 없어 미채택.
  change_detection:
    spectral_min: 0.5
  postprocess:
    min_component_area_m2: 25
    # T2가 전역적으로 밝아(밝기 차 중앙값 +22) 원시 brightness_delta로는 후보의 75%가
    # "밝아짐" - 철거/신축 방향 검사가 무력해져 AOI 전역 이동량을 빼고 판정한다.
    brightness_center_global_shift: true
  classification:
    # 육안검수(HIGH 20건)에서 0~8㎡만 경계에 걸친 건물이 "증축(대장 근거 확정)"
    # HIGH로 오른 오탐이 반복 - 10㎡(1m 기준 10픽셀) 미만 접촉은 기타 변화로 둔다.
    min_building_change_area_m2: 10
    # 육안검수 철거 추정 10건 중 실제 철거 1건 - 산지 그림자·하천 모래·도로 반사가
    # 철거로 잡혔다(지목 임 47/107건). 건물이 서기 어려운 지목은 기타 변화로 내린다.
    demolition_exclude_jimok: ["임", "천", "도", "구", "제"]

