project:
  id: jeju_gimnyeong
  name: "제주김녕 공공주택지구 위성영상 기반 변화탐지 PoC (Sentinel-2 vs CAS500-1 비교)"
  short_name: "제주김녕"
  official_name: "제주김녕 공공주택지구"
  location: "제주특별자치도 제주시 구좌읍 김녕리 일원"
  official_area_m2: null  # AOI 수집 시 area_m2_calc(실측 폴리곤 면적)로 대체 - 언론 보도(108,388m²)는 미검증 참고치
  operator: "한국토지주택공사 (제주지역본부)"
  analysis_crs: "EPSG:5179"

crs_decision_note: >
  hwaseong_jinan은 EPSG:5186(중부원점, 중앙자오선 127E)을 썼지만, 제주는 원점(위도
  38N)에서 훨씬 멀리 떨어져 있어(위도 33.5N) 왜곡이 커진다. 이번 CAS500-1 gdb
  원본 좌표계가 이미 EPSG:5179(KGD2002 Unified CS, 전국 단일좌표계)이고, 국내
  다수 기관이 제주 지역 GIS 작업에 통일좌표계를 실무적으로 사용하므로 별도
  재투영 왜곡 없이 EPSG:5179를 분석좌표계로 채택한다.

