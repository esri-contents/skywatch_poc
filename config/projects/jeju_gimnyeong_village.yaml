  output_root: "outputs/jeju_gimnyeong_village"
  aoi: "data/projects/jeju_gimnyeong_village/aoi/jeju_gimnyeong_village_aoi.gpkg"
  buildings: "data/projects/jeju_gimnyeong_village/processed/buildings.gpkg"
  cadastre: "data/projects/jeju_gimnyeong_village/processed/cadastre.gpkg"
  building_register: "data/projects/jeju_gimnyeong_village/raw/building_register/title_info.json"
  building_permits: "data/projects/jeju_gimnyeong_village/raw/building_permits/basic_outline.json"
  output_gdb: "outputs/jeju_gimnyeong_village/arcgis/jeju_gimnyeong_village.gdb"
  output_aprx: "outputs/jeju_gimnyeong_village/arcgis/jeju_gimnyeong_village.aprx"
  reports: "outputs/jeju_gimnyeong_village/reports"

aoi:
  status: demo
  provider: "VWorld 건물밀도 기반 자체 산정 (LH 공식 지구 아님)"
  note: "600m x 600m 정사각형, 중심 (126.7485E, 33.5565N) - VWorld lt_c_spbd 건물
    8,442동을 CAS500-1 장면 footprint 전체에서 그리드 집계해 찾은 최고밀도 지점"

imagery:
  provider: "Element 84 Earth Search (AWS Open Data)"
  stac_api: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-c1-l2a"
  bands: ["B02", "B03", "B04", "B08"]
  asset_aliases: {B02: blue, B03: green, B04: red, B08: nir, SCL: scl}
  epochs:
    - id: t0
      date: "2021-11-28"
      item_id: "S2A_T52SBC_20211128T022033_L2A"
      role: "jeju_gimnyeong과 동일 장면(같은 Sentinel-2 타일 T52SBC) - AOI만 마을
        중심부로 이동, 이 AOI 내부 구름 재계산으로 재검증함"
    - id: t1
      date: "2023-10-19"
      item_id: "S2A_T52SBC_20231019T022334_L2A"
      role: "jeju_gimnyeong과 동일 장면 재사용"
  selection_note: >
    jeju_gimnyeong 프로젝트에서 이미 AOI 내부 구름 0%로 검증된 두 Sentinel-2
    장면을 그대로 재사용한다 - 같은 타일(T52SBC)이므로 유효하다. 다만 AOI
    좌표가 달라졌으므로 이 프로젝트의 새 AOI 기준으로 SCL을 다시 계산해
    재확인해야 한다 (acquire_imagery가 실행 시 자동 재계산).

cas500_imagery:
  source_gdb: "D:/NGII_CAS500_1_IMAGE.gdb"
  mosaic_dataset: "NGII_CAS500_1"
  native_crs: "EPSG:5179"
  native_cell_size_m: 0.5
  band_count: 4
  band_order_assumption: "jeju_gimnyeong과 동일 가정 (Blue/Green/Red/NIR, 미확정) 참고."
  epochs:
    - id: t0
      date: "2021-11-27"
      raster_name: "C1_20211127020937_03799_00075386"
      raster_path: "D:/NGII_CAS500_1_IMAGE.gdb/C1_20211127020937_03799_00075386"
    - id: t1
      date: "2023-10-25"
      raster_name: "C1_20231025021510_14397_00025893"
      raster_path: "D:/NGII_CAS500_1_IMAGE.gdb/C1_20231025021510_14397_00025893"
  coverage_note: >
    jeju_gimnyeong과 동일한 raster item 2개를 그대로 재사용한다 (같은 장면이
    새 AOI도 포함함을 arcpy footprint intersect로 확인, 2026-09-11).

