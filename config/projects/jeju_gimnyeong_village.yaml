project:
  id: jeju_gimnyeong_village
  name: "제주 구좌읍 김녕리 마을 위성영상 기반 변화탐지/불법건축물 스크리닝 데모"
  short_name: "김녕리 마을"
  official_name: "제주시 구좌읍 김녕리 (마을 중심부, 비공식 데모 AOI)"
  location: "제주특별자치도 제주시 구좌읍 김녕리 일원"
  official_area_m2: 360000
  operator: "N/A (LH 공공주택지구 아님 - 실제 건물 밀집지역에서 불법건축물 스크리닝 로직을 검증하기 위한 데모)"
  analysis_crs: "EPSG:5179"

demo_note: >
  jeju_gimnyeong(제주김녕 공공주택지구)은 신규 택지개발 예정지라 AOI 안에 기존
  건물이 0동이었다 - 그 결과 REQ02(불법건축물 스크리닝)와 NEW_BUILDING 분류
  로직이 애초에 대조할 대장/footprint가 없어 항상 NONE/빈 결과만 냈다. 같은
  CAS500-1 장면 쌍(2021-11-27 / 2023-10-25)이 훨씬 넓은 영역(약 14km x 14km)을
  덮고 있다는 점을 이용해, VWorld 건물 레이어(lt_c_spbd) 밀도를 그리드로 집계해
  실제 건물이 가장 밀집한 좌표(126.7485E, 33.5565N 부근, 반경 약 300m 안에
  1,400여 동)를 찾아 그 자리에 600m x 600m 데모 AOI를 새로 만들었다. LH
  공공주택지구가 아니므로 zonecode/공식 고시/보상기준일 절차는 적용하지
  않는다 - 목적은 순수하게 "기존 건물이 실제로 있는 지역에서 파이프라인의
  건물 매칭·분류·불법 스크리닝이 의도대로 동작하는지" 검증이다.

