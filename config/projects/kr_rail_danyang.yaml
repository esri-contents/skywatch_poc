# 한국철도공단 토지보상 Demo - 중앙선 도담~영천 복선전철, 단양군 매포읍 매포리·하괴리 일대
# Sentinel-2 기반 다중시점 변화 Screening PoC (SkyWatch 50cm 구매 전 단계).
#
# 이 프로젝트는 src/multitemporal_pipeline.py 전용이다. 연도쌍별 변화탐지는 기존
# src/imagery_change_pipeline.py(run_imagery_change_detection)를 그대로 재사용한다.
#
# 역할 분담:
#   Sentinel-2 (10m)   : "어디가 바뀌었는가?"  -> change hotspot / 고해상도 ROI 추천
#   SkyWatch 50cm(향후): "무엇이 생겼고 없어졌고 형태가 어떻게 변했는가?"
# Sentinel-2 결과만으로 지장물/보상대상/불법건축물을 확정하지 않는다.

project:
  id: kr_rail_danyang
  name: "한국철도공단 토지보상 Demo - 단양 매포읍 변화 Screening"
  short_label: "한국철도공단 단양 매포"
  customer: "한국철도공단"
  location: "충청북도 단양군 매포읍 매포리·하괴리 일대"
  purpose: "SkyWatch 50cm 구매 전 Sentinel-2 시계열 Screening (Decision Support - 지장물/보상 판정 자료 아님)"
  analysis_crs: "EPSG:5186"   # 매포읍 경도 128.3E - 중부원점 적용범위(125.5~128.5E) 이내, config/config.yaml과 동일 근거
  context:
    # 아래 날짜들은 사업 개요 context일 뿐이며 보상 기준일/법적 기준일/지장물 판정 기준일이 아니다.
    railway_project: "중앙선 도담~영천 복선전철"
    construction_start: {"도담~안동": "2015-05", "안동~영천": "2015-11"}
    double_track_opening: {"도담~안동": "2022-07", "안동~영천": "2024-12-21"}

aoi:
  status: provisional
  source: "VWorld Data API LT_C_ADRI_INFO (법정리 경계) - 매포읍 매포리 + 하괴리 dissolve"
  source_script: "src/data/build_kr_rail_danyang_aoi.py"
  note: >
    잠정 AOI. 행정경계(법정리)이며 사업구역/보상구역 경계가 아니다. 사용자가 검토 중인
    SkyWatch 검색 범위(약 22.3 km^2)의 geometry는 저장소에 없어 임의로 재현하지 않았다
    (실측 AOI 면적은 outputs/kr_rail_danyang/reports/sentinel2_baseline_report.md 참고).
    공식 SkyWatch 검색 geometry를 받으면 paths.aoi만 교체하면 된다.
  railway_source: "OpenStreetMap Overpass (railway=rail, 중앙선) - 공식 노선 geometry 아님"

paths:
  data_root: "data/projects/kr_rail_danyang"
  output_root: "outputs/kr_rail_danyang"
  aoi: "data/projects/kr_rail_danyang/aoi/danyang_master_aoi.geojson"
  ri_boundaries: "data/projects/kr_rail_danyang/aoi/danyang_ri_all.geojson"
  railway: "data/projects/kr_rail_danyang/aoi/osm_railway.geojson"
  imagery_dir: "data/projects/kr_rail_danyang/raw/sentinel2"       # raw/ 는 .gitignore 처리됨
  skywatch_dir: "data/projects/kr_rail_danyang/raw/skywatch"       # 향후 50cm GeoTIFF 위치(현재 비어 있음)

imagery:
  provider: sentinel2          # sentinel2 | local_geotiff (향후 SkyWatch 50cm)
  band_order: ["B02", "B03", "B04", "B08"]
  resolution_m: 10             # 모든 연도쌍이 동일 grid를 쓰도록 고정(change intensity 합성에 필요)
  # Sentinel-2는 2015-06 이후에만 존재 - 2010~2015 구간은 Sentinel-2로 Screening하지 않는다.
  years: [2016, 2018, 2020, 2022, 2024, 2026]
  # 동일 계절 비교(식생 위상 차이로 인한 오탐 최소화). 4~5월: 전 연도 구름 적은 장면 확인됨.
  season: {start: "04-10", end: "05-31", target_mmdd: "05-01"}
  max_scene_cloud_pct: 20
  # AOI polygon 내부 SCL clear 비율 하한. 0.98은 2018년 후보 최고치(0.978)가 못 넘어 0.95로 낮춤:
  # 이 AOI는 밝은 채석장/산업 지표가 많아 SCL이 일부를 구름/눈으로 오분류해 구름이 거의 없는
  # 장면(scene cloud<2%)도 AOI clear가 97~99%에 머문다(2016/2026 선택본도 98~99%). 선택 후보의
  # scene cloud/AOI clear는 scene_selection.json에 모두 남긴다.
  min_aoi_clear_fraction: 0.95
  # local_geotiff provider용 (향후 SkyWatch). 날짜/scene_id는 실제 메타데이터만 기입.
  local_files: {}

pairs:
  # Phase A: 최소 실행 경로 - 첫/마지막 연도 한 쌍으로 end-to-end 검증
  phase_a: [2016, 2026]
  # Phase B: 연속 연도쌍 + 장기 비교
  consecutive: true
  long_term: [[2016, 2026], [2020, 2026]]

analysis:
  base_config: "config/config.yaml"
  threshold_method: "fixed"
  mask_threshold: 0.5
  # 10m 해상도에서 1 pixel = 100 m^2. 노이즈 억제를 위해 4 pixel(400 m^2) 이상만 후보로 유지.
  min_component_area_m2: 400
  ssim_win_size: 7
  confidence_thresholds: {high: 0.7, medium: 0.4}

hotspot:
  top_n: 5
  cluster_distance_m: 60        # 이 거리 이내의 변화 polygon은 하나의 hotspot으로 묶는다
  min_hotspot_area_m2: 1000     # 이보다 작은 군집은 hotspot에서 제외(10 pixel 미만)
  recommend_min_area_m2: 5000   # 고해상도 확인 추천 최소 면적
  recommend_min_score: 0.5      # 고해상도 확인 추천 최소 change_score
  buffer_m: 300                 # ROI = hotspot bounds + buffer
  min_roi_size_m: 500           # ROI 최소 한 변 길이(주변 맥락 확보)
  max_roi_size_m: 1000          # ROI 최대 한 변 길이(초과 시 hotspot 중심 기준으로 자름, roi_clipped=true)
  railway_corridor_buffer_m: 300   # OSM 철도(비공식) 양측 이 거리 이내 변화량을 corridor_change_area_m2로 별도 집계
  roi_overlap_merge: 0.5        # ROI가 이 비율 이상 겹치면 낮은 순위 ROI는 생략

acquisition_years:
  # 연도별 변화 면적이 "가장 큰 연도쌍 대비 이 비율" 이상이면 active로 본다
  active_fraction_of_max: 0.25

analysis_limitations:
  - "Sentinel-2 공간해상도는 10m로 개별 지장물/소형 건물 판독용이 아니다."
  - "본 결과는 change candidate / change hotspot이며 possible construction-related change일 뿐, 반드시 고해상도 영상(SkyWatch 50cm 등)으로 검증해야 한다."
  - "change candidate는 보상 대상 지장물이 아니며 불법/무허가 건축물도 아니다. 법적·행정적 판단은 본 Demo 범위 밖이다."
  - "계절·식생(농경지 경운/작황), 그림자, 대기/센서 차이, 영상 정합오차가 오탐을 유발할 수 있다."
  - "'변화 없음'이 아니라 'Sentinel-2에서는 유의미한 변화가 검출되지 않음'으로 해석해야 한다."
  - "Sentinel-2는 2015-06 이후만 존재해 착공(2015) 이전 상태(2010~2015)는 이 Screening으로 확인할 수 없다."

# ---------------------------------------------------------------------------
# NDVI x 연속지적도 필지 단위 토지피복(식생) 변화 모니터링 (src/ndvi/pipeline.py 전용)
# 위 섹션들은 기존 multitemporal_pipeline이 쓰며, 이 섹션은 기존 파이프라인이 읽지 않는다.
# 아래 임계값/가중치는 검증된 과학적·행정적 기준이 아니라 초기 탐색용 가설이다.
# ---------------------------------------------------------------------------
ndvi:
  output_dir: "outputs/kr_rail_danyang/ndvi"
  scene_selection: "outputs/kr_rail_danyang/reports/scene_selection.json"
  grid_resolution_m: 10
  grid_snap: true
  reflectance_scale: 10000.0         # L2A DN -> 반사율. offset은 scene_selection의 boa_offset_removed_dn으로 이미 제거됨(중복 적용 금지)
  reflectance_warn_max: 1.5          # 이 값을 넘는 반사율 비율을 QA에 기록
  resampling: "nearest"              # 반사율 재투영(UTM52N -> EPSG:5186). 마스크 혼합 방지

  cadastre:
    local_path: null                 # --cadastre 로 덮어쓸 수 있음
    cache_dir: "data/projects/kr_rail_danyang/cadastre"
    primary_layer: "lp_pa_cbnd_bubun"   # 실측: PNU/지번/주소 보유, 본번 단독 필지 포함 전체 필지
    qa_layer: "lp_pa_cbnd_bonbun"       # 실측: id/col_adm_se/bonbun만 존재(PNU 없음) - 커버리지 QA 전용
    fetch_buffer_deg: 0.002

  railway:
    include_railway_values: ["rail"]   # OSM railway=rail (abandoned 제외). 공식 사업구역 아님
    official_boundary_path: null       # 향후 공식 철도사업구역/선형 제공 시 여기에 지정하면 OSM 대체
    distance_bands_m: [100, 300, 500]

  # 탐색 임계값 profile. default가 본 분석, 나머지는 민감도 분석용.
  thresholds:
    default:      {before_min: 0.35, after_max: 0.20, delta_max: -0.20, recovery_ndvi: 0.35}
    conservative: {before_min: 0.45, after_max: 0.15, delta_max: -0.30, recovery_ndvi: 0.30}
    relaxed:      {before_min: 0.30, after_max: 0.25, delta_max: -0.15, recovery_ndvi: 0.40}
  min_followup_obs: 1                # 지속성 판정에 필요한 감소 이후 유효 관측 수. 미만이면 '지속성 미확인'
  min_valid_obs_pixel: 4             # 픽셀이 변화 분석 대상이 되기 위한 최소 유효 관측 연도 수

  parcel_quality:
    min_effective_pixels: 4          # 분석면적/픽셀면적 미만이면 LOW_PIXEL_COUNT
    min_evaluable_fraction: 0.80     # 평가가능 면적/분석면적 미만이면 LOW_COVERAGE
    min_year_valid_fraction: 0.50    # 어느 한 연도라도 유효비율이 이 값 미만이면 CLOUD_CONTAMINATION
    min_valid_years: 4               # 유효 연도 수 미만이면 INSUFFICIENT_DATA

  classification:
    decline_ratio_min: 0.10          # 평가가능 면적 대비 감소 면적 비율
    decline_area_min_m2: 300         # 감소 면적 하한(3 pixel)
    recovery_delta_min: 0.10         # 평균 NDVI(마지막-처음) 회복 기준
    stable_delta_abs_max: 0.10
    fluctuation_std_min: 0.10        # 연도별 평균 NDVI 표준편차
    vegetation_mean_ndvi_min: 0.35   # STABLE_VEGETATION 판정용 평균 NDVI 하한
    first_change_min_area_m2: 200

  priority:
    weights: {decline_ratio: 0.40, persistence: 0.35, rail_proximity: 0.25}
    decline_ratio_full_score: 0.50   # 이 감소 비율에서 100점
    persistence_scores: {PERSISTENT: 100, UNCONFIRMED: 50, TEMPORARY: 30, NONE: 0}
    rail_full_score_distance_m: 0    # 이 거리 이하 100점
    rail_zero_score_distance_m: 500  # 이 거리 이상 0점
    min_decline_area_m2: 300         # 우선 검토 목록 포함 하한
    review_types: ["PERSISTENT_DECLINE", "DECLINE_UNCONFIRMED"]
    tiers: {high: 60, medium: 40}    # 상/중/하 표시용 임의 구분(행정 기준 아님)

# ---------------------------------------------------------------------------
# NDVI + BSI 복합 변화탐지 / 채석장 관련 후보 분석 (src/ndvi/bsi_pipeline.py, --enable-bsi)
# 초기 임계값은 단양 AOI 실측 분포(20m, 2016~2026)에서 잡은 탐색용 가설이며 검증된 기준이 아니다:
#   NDVI>0.7 픽셀 BSI 중앙값 약 -0.26, NDVI<0.2 픽셀 BSI 중앙값 약 +0.03~0.06 (p95 약 0.10~0.18)
# ---------------------------------------------------------------------------
bsi:
  output_dir: "outputs/kr_rail_danyang/bsi"
  swir_cache_dir: "data/projects/kr_rail_danyang/raw/sentinel2_swir"   # 기존 scene_id와 동일 장면의 B11(20m)
  reference_dir: "data/projects/kr_rail_danyang/reference"
  grid_resolution_m: 20             # B11 원본 해상도. 10m 보간 금지
  aggregate_min_valid_10m: 4        # 20m 셀 안 10m 픽셀 중 유효해야 하는 개수(4=엄격)
  min_denominator: 0.001
  water_mndwi_min: 0.0              # MNDWI > 이 값이면 수체/습윤 의심 -> 노출지 판정 제외, UNCERTAIN
  bias_correction: true             # 연도쌍별 안정 픽셀(|dNDVI|<stable_dndvi) 중앙값으로 dBSI 편이 보정
  stable_dndvi: 0.05
  ndvi: {before_min: 0.35, after_max: 0.20, delta_max: -0.20, recovery_ndvi: 0.35, recovery_delta_min: 0.20}
  bsi:  {increase_min: 0.10, decrease_min: 0.05, exposed_min: 0.0, conflict_decrease_min: 0.10}
  exposed_state: {ndvi_max: 0.25}
  min_persistent_exposed_obs: 4     # TYPE C 상태 판정: 노출 상태 관측 횟수 하한
  min_valid_obs_pixel: 4
  min_followup_obs: 1
  quarry:
    reference_tags: {landuse: ["quarry"]}      # natural=bare_rock 등은 맥락 정보로만 기록
    adjacency_distance_m: 40
    min_component_pixels: 2
  parcel:
    min_area_m2_for_composite: 800    # 20m 픽셀 2개. 미만이면 복합지표 판단 보류(INSUFFICIENT_DATA)
    min_change_area_m2: 800
    min_change_ratio: 0.10
    min_evaluable_fraction: 0.8
  rankB:
    weights: {exposed_ratio: 0.40, quarry_link: 0.35, persistence: 0.25}
    exposed_ratio_full_score: 0.50
    quarry_link_scores: {POTENTIAL_QUARRY_EXPANSION: 100, QUARRY_INTERNAL_CHANGE: 60, EXPOSED_SURFACE_CHANGE: 40}
    persistence_scores: {PERSISTENT: 100, UNCONFIRMED: 50, REVEGETATED: 20}
    min_exposed_area_m2: 800
  sensitivity:
    ndvi_delta_max: [-0.15, -0.20, -0.30]
    bsi_increase_min: [0.05, 0.10, 0.15]
    min_component_pixels: [1, 2, 4]
    min_followup_obs: [1, 2]
    adjacency_distance_m: [20, 40, 80, 120]
  context:                          # 농경지/토지이용 맥락(혼동 위험 플래그용, 변화를 확정하지 않음)
    cache_dir: "data/projects/kr_rail_danyang/context"
    lulc_years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]   # IO LULC annual v02 제공 연도
    agri_share_min: 0.5
