project:
  id: gwangmyeong_siheung_aerial
  name: 광명시흥 공공주택지구 항공사진 기반 변화탐지 PoC (항공 정사영상, 2022-12 vs 2024)
  short_name: 광명시흥
  official_name: 광명시흥 공공주택지구
  location: 경기도 광명시 광명동·옥길동·가학동·노온사동, 시흥시 과림동·무지내동·금이동 일원
  official_area_m2: null
  operator: 한국토지주택공사(LH) · 경기주택도시공사(GH) 공동 시행
  analysis_crs: EPSG:5186
satellite:
  provider: planetary-computer
  collection: sentinel-2-l2a
  bands:
  - B02
  - B03
  - B04
  - B08
  max_cloud_cover_pct: 20
  t1_date_range: 2022-01-01/2022-12-31
  t2_date_range: 2024-01-01/2024-12-31
  search_bbox_wgs84:
  - 126.82481755
  - 37.40862035
  - 126.86556604
  - 37.47724145
  known_limitation: '10m 해상도로 개별 단독주택 단위 신축/증축 탐지는 어려움. 대형 아파트단지/ 대규모 토지조성 등 큰 변화
    위주로 검증 후 SkyWatch Benchmark에서 고해상 상용영상과 비교한다.

    '
crs:
  source_crs: EPSG:4326
  analysis_crs: EPSG:5186
  decision_note: 'EPSG:5186 (Korea 2000 / Central Belt 2010, 중부원점, 중앙자오선 127E)을 선택.
    창릉 AOI 경도범위(126.87~126.91E)가 중부원점 적용범위(125.5~128.5E)에 들어가며, 국내 서울/경기 지역 공공 GIS
    데이터에서 가장 널리 쓰이는 표준 투영좌표계이기 때문. Sentinel-2 실측 확인: EPSG:32652 (WGS 84 / UTM zone
    52N), 10m, uint16, nodata=0. Raster Preprocessing 단계에서 EPSG:5186으로 재투영한다. NGII
    정사영상은 확보 후 별도로 원본 CRS를 확인한다.

    '
alignment:
  method: ECC
  max_allowed_rmse_m: 10.0
change_detection:
  methods:
  - robust_cva
  - ssim
  - edge_texture
  - ensemble
  min_area_thresholds_m2:
  - 10
  - 25
  - 50
  - 100
  threshold_method: fixed
  mask_threshold: 0.5
  spectral_min: 0.5
postprocess:
  morphology:
    opening_kernel: 3
    closing_kernel: 3
  min_component_area_m2: 25
  brightness_center_global_shift: true
spatial_statistics:
  k: 8
  permutations: 999
random_seed: 42
classification:
  buffer_distances_m:
  - 3
  - 5
  change_ratio_new_building_min: 0.5
  min_building_change_area_m2: 10
  demolition_exclude_jimok:
  - 임
  - 천
  - 도
  - 구
  - 제
priority_scoring:
  weights:
    change_confidence: 0.4
    change_ratio: 0.3
    administrative_uncertainty: 0.2
    building_relevance: 0.1
  thresholds:
    high: 0.7
    medium: 0.4
validation_sample:
  high_n: 50
  medium_n: 30
  low_n: 20
compensation:
  baseline_date: '2022-11-29'
  baseline_type: 지구지정 및 지형도면 등의 고시일(국토교통부고시 제2022-673호) - 이 지구는 이미 보상계획공고 단계까지 진행되어(아래
    note) 실제 이주대책기준일/권리산정기준일이 보상계획공고문에 명시돼 있을 가능성이 높으나, 이번 조사에서는 그 원문을 직접 확인하지 못해
    지구지정고시일을 잠정값으로 사용한다. [미확정 잠정값]
  source_url: https://eum.go.kr/web/gs/gv/gvGosiDet.jsp?seq=540298
  business_confirmed: false
  interim_use_approved: true
  interim_use_note: '2026-09-17 WebSearch(2차 자료, 원문 미확보) 기준 추진경위: 2021-02-24 3기 신도시
    신규 후보지 발표 -> 2022-11-29 지구지정 및 지형도면 고시 (국토교통부고시 제2022-673호) -> 2023-07-11 지구지정
    변경(1차, 집단취락지역 제척, 제2023-396호) -> 2024-12-30 지구지정 변경(2차) 및 지구계획 승인 (제2024-875호)
    -> 2025-08-27 토지·물건 보상계획 및 열람 공고(1차) -> 2026-07-31 보상계획 및 열람 공고(2차). 즉 하남진안/제주김녕과
    달리 이미 보상계획공고까지 실제로 진행된 사업이다 - LH·GH 공고문 원문(보상계획공고 PDF)에 이주대책기준일/권리산정기준일이 명시돼 있을
    가능성이 높지만, 이번 조사에서는 뉴스 2차 보도까지만 확인했고 그 공고문 원문을 직접 열어보지 못했다. business_confirmed를
    true로 바꾸려면 GH(gh.or.kr)/LH(lh.or.kr) 보상계획공고 원문에서 이주대책기준일 조항을 직접 확인해야 한다.

    '
  open_questions_for_business_team:
  - 2025-08-27(1차)/2026-07-31(2차) 보상계획 및 열람 공고 원문에 이주대책 기준일 또는 권리산정기준일이 명시되어 있는가?
    명시되어 있다면 그 날짜로 baseline_date를 교체해야 한다.
  - 2023-07-11 집단취락지역 제척(1차 변경)으로 AOI 경계가 바뀌었는가? VWorld가 서비스하는 현재 경계가 어느 시점 기준인지 사업부서
    확인 필요.
illegal_screening:
  tolerance_ratio: 1.3
  strong_change_ratio: 0.5
  strong_confidence: 0.6
progress_monitor:
  grid_cell_size_m: 250.0
  site_persistence_distance_m: 30.0
imagery_tasking:
  recent_days_window: 90
  season_months:
  - 4
  - 6
field_survey:
  buffer_m_for_near_change: 3.0
reality_3d:
  review_buffer_m: 20.0
  floor_height_m: 3.0
  target_gsd_cm: 3.0
  overlap_pct: 75
arcgis_pro:
  output_gdb: outputs/gwangmyeong_siheung_aerial/arcgis/gwangmyeong_siheung_aerial.gdb
  template_aprx: outputs/arcgis/templates/blank_template.aprx
paths:
  data_root: data/projects/gwangmyeong_siheung_aerial
  output_root: outputs/gwangmyeong_siheung_aerial
  aoi: data/projects/gwangmyeong_siheung_aerial/aoi/gwangmyeong_siheung_official.gpkg
  buildings: data/projects/gwangmyeong_siheung_aerial/processed/buildings.gpkg
  cadastre: data/projects/gwangmyeong_siheung_aerial/processed/cadastre.gpkg
  building_register: data/projects/gwangmyeong_siheung_aerial/raw/building_register/title_info.json
  building_permits: data/projects/gwangmyeong_siheung_aerial/raw/building_permits/basic_outline.json
  output_gdb: outputs/gwangmyeong_siheung_aerial/arcgis/gwangmyeong_siheung_aerial.gdb
  output_aprx: outputs/gwangmyeong_siheung_aerial/arcgis/gwangmyeong_siheung_aerial.aprx
  reports: outputs/gwangmyeong_siheung_aerial/reports
