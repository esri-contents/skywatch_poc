project:
  id: hwaseong_jinan
  name: 화성진안 공공주택지구 위성영상 기반 변화탐지 PoC
  short_name: 화성진안
  official_name: 화성진안 공공주택지구
  location: 경기도 화성시 진안동·반정동·반월동·기산동·병점동 일원
  official_area_m2: 4525533
  operator: 한국토지주택공사
  analysis_crs: EPSG:5186
satellite:
  provider: planetary-computer
  collection: sentinel-2-l2a
  bands:
  - B02
  - B03
  - B04
  - B08
  max_cloud_cover_pct: 20
  t1_date_range: 2022-01-01/2022-12-31
  t2_date_range: 2024-01-01/2024-12-31
  search_bbox_wgs84:
  - 127.02347620000002
  - 37.21445776000001
  - 127.06859103
  - 37.23789327
  known_limitation: '10m 해상도로 개별 단독주택 단위 신축/증축 탐지는 어려움. 대형 아파트단지/ 대규모 토지조성 등 큰 변화
    위주로 검증 후 SkyWatch Benchmark에서 고해상 상용영상과 비교한다.

    '
crs:
  source_crs: EPSG:4326
  analysis_crs: EPSG:5186
  decision_note: 'EPSG:5186 (Korea 2000 / Central Belt 2010, 중부원점, 중앙자오선 127E)을 선택.
    창릉 AOI 경도범위(126.87~126.91E)가 중부원점 적용범위(125.5~128.5E)에 들어가며, 국내 서울/경기 지역 공공 GIS
    데이터에서 가장 널리 쓰이는 표준 투영좌표계이기 때문. Sentinel-2 실측 확인: EPSG:32652 (WGS 84 / UTM zone
    52N), 10m, uint16, nodata=0. Raster Preprocessing 단계에서 EPSG:5186으로 재투영한다. NGII
    정사영상은 확보 후 별도로 원본 CRS를 확인한다.

    '
alignment:
  method: ECC
  max_allowed_rmse_m: 10.0
change_detection:
  methods:
  - robust_cva
  - ssim
  - edge_texture
  - ensemble
  min_area_thresholds_m2:
  - 10
  - 25
  - 50
  - 100
  threshold_method: fixed
  mask_threshold: 0.5
postprocess:
  morphology:
    opening_kernel: 3
    closing_kernel: 3
  min_component_area_m2: 25
spatial_statistics:
  k: 8
  permutations: 999
random_seed: 42
classification:
  buffer_distances_m:
  - 3
  - 5
  change_ratio_new_building_min: 0.5
priority_scoring:
  weights:
    change_confidence: 0.4
    change_ratio: 0.3
    administrative_uncertainty: 0.2
    building_relevance: 0.1
  thresholds:
    high: 0.7
    medium: 0.4
validation_sample:
  high_n: 50
  medium_n: 30
  low_n: 20
compensation:
  baseline_date: '2022-02-21'
  baseline_type: 전략환경영향평가서 초안 주민공람 시작일 - 지구지정 전 유일한 주민공람 절차 (미확정 - 아래 web_review 참고)
  source_url: https://www.suwon.go.kr/common-upload/upload/board/2025/9/29/4de4f9a7-ccca-4f95-a0d1-8712e1713226.pdf
  source_local_copy: data/projects/hwaseong_jinan/source_docs/화성진안_환경영향평가서초안_요약문_2025-09.pdf
  business_confirmed: false
  interim_use_approved: true
  interim_use_note: '2026-09-10, 원문 재조사 결과 2021-08-30을 폐기하고 2022-02-21로 교체. 근거: (1)
    실제 지구지정고시 원문(국토교통부고시 제2024-81호, 관보 제20684호, data/projects/hwaseong_jinan/source_docs/국토교통부_제2024-81호_고시.pdf,
    243p)을 전문 텍스트 추출해 확인한 결과 "권리산정기준일"·"이주대책기준일"·"기준일"· "투기방지" 어느 표현도 등장하지 않음 - 2021-08-30(정책발표일)이
    이 고시와 무관함을 원문으로 재확인. (2) LH가 직접 작성한 화성진안 환경영향평가서(초안) 요약문(2025-09, source_url)의
    "3. 사업의 추진경위"에 따르면 지구지정 제안 (2021-08-06)부터 지구지정고시(2024-02-07) 사이 주민 의견수렴 절차는 2022-02-21~03-25
    전략환경영향평가서 초안 공람이 유일하다 - 대법원 판례상 이주대책기준일 원칙("지구지정을 위한 주민공람공고일")에 가장 부합하는 실존 후보.
    (3) 세 후보(2021-08-30 폐기 / 2022-02-21 / 2024-02-07 지구지정고시) 중 더 이른 날짜를 쓰면 REQ03이
    과소플래그보다 과다플래그로 치우쳐 안전하다는 기존 원칙은 유지. pipeline.py는 business_confirmed가 false인 동안
    REQ03 결과에 "[미확정 잠정값]" 표시를 자동으로 남겨 이번 실행 결과가 최종 보상 판정 근거가 아님을 모든 산출물(traceability
    report 등)에서 드러낸다. 사업부서 확정이 나오면 baseline_date를 교체하고 business_confirmed를 true로 바꿀
    것.

    '
  note: '2021-08-30(국토교통부 제3차 신규 공공택지 발표일)은 2026-09-10 원문 재조사로 이 프로젝트의 어떤 행정절차와도 무관함이
    확인되어 후보에서 제외했다. 2022-02-21은 전략환경영향평가 초안 공람 시작일(현재 baseline_date), 2024-02-07은
    지구지정 고시일이므로 서로 혼동하지 않는다. 보상계획 공고는 2026-09-10 확인 기준 아직 나오지 않았다(2027-12 예정).

    '
  web_review:
    reviewed_at: '2026-09-10'
    conclusion: '2026-09-08 조사(2차 뉴스자료)에 이어, 2026-09-10에 원문 문서 두 건을 직접 전문 확보·텍스트 추출해
      재검토했다: (1) 지구지정고시 원문(국토교통부고시 제2024-81호, 관보 제20684호, 243페이지 전체) - "권리산정기준일"·
      "이주대책기준일"·"기준일" 어느 표현도 없음을 전문 검색으로 확인, 이 고시는 명칭·위치·면적·사업시행자·토지세목조서(붙임1)·도시기본계획(붙임2)·열람방법만
      규정한다. (2) LH가 작성한 화성진안 환경영향평가서(초안) 요약문(2025-09)의 "사업의 추진경위" - 지구지정 제안(2021-08-06)부터
      지구지정고시(2024-02-07) 사이 주민 의견수렴 절차는 2022-02-21~03-25 전략환경영향평가서 초안 공람이 유일함을 확인.
      결론: 화성진안에 대해 별도로 권리산정기준일/이주대책기준일을 고시한 문서는 여전히 발견되지 않았고, 지구지정고시 원문에도 없다 - 즉 이
      정보는 애초에 공개된 관보·web 자료만으로는 확정할 수 없고 사업부서/LH 내부 공고(관보 미게재 공고 가능성)를 확인해야 한다. business_confirmed는
      false로 유지하되, baseline_date 후보를 2021-08-30(무관 확인됨, 폐기)에서 2022-02-21(판례상 원칙에 가장
      부합하는 실존 주민공람일)로 교체했다.

      '
    supporting_facts:
    - date: '2021-08-30'
      event: 국토교통부 '제3차 신규 공공택지 추진계획' 발표 (화성진안 최초 공개) - 폐기된 후보
      note: '투기방지 조치는 ''토지거래허가구역 지정''과 ''2018년~발표일 실거래 조사''이며, 권리산정기준일·이주대책기준일을 이
        날짜로 고시한다는 내용은 보도자료에 없음. 2026-09-10 지구지정고시 원문(243p) 전문 검색으로도 이 날짜/투기방지 조치에
        대한 언급이 전혀 없음을 재확인 - 이 프로젝트의 실제 행정절차와 무관.

        '
      source: https://www.korea.kr/news/policyBriefingView.do?newsId=156468392
    - date: '2021-08-06'
      event: 화성진안 공공주택지구 지정제안 (LH 환경영향평가서 초안 요약문 '사업의 추진경위' 원문)
      source: https://www.suwon.go.kr/common-upload/upload/board/2025/9/29/4de4f9a7-ccca-4f95-a0d1-8712e1713226.pdf
    - date: 2022-02-21 ~ 2022-03-25
      event: 전략환경영향평가서 초안 공람 - 지구지정 제안(2021-08-06)과 지구지정고시(2024-02-07) 사이에 있는 유일한
        주민 의견수렴 절차 (LH 원문 '3. 사업의 추진경위' 표에서 확인, 이 구간에 다른 주민공람 이벤트는 없음)
      source: https://www.suwon.go.kr/common-upload/upload/board/2025/9/29/4de4f9a7-ccca-4f95-a0d1-8712e1713226.pdf
    - date: '2024-02-07'
      event: 지구지정 고시 (국토교통부고시 제2024-81호, 관보 제20684호) - 원문 243페이지 전체를 텍스트로 추출해 전문 검색한
        결과 '권리산정기준일'·'이주대책기준일'·'기준일'·'투기방지' 어떤 표현도 없음. 고시 본문은 명칭/위치/면적/지정일(관보게재일)/사업종류/사업시행자/
        토지세목조서(붙임1)/도시기본계획(붙임2)/열람방법 8개 항목뿐
      source: data/projects/hwaseong_jinan/source_docs/국토교통부_제2024-81호_고시.pdf
    - date: 2024-현재
      event: 지구지정고시 이후 사업구역 내 행위제한이 실제로 시행 중 (기업 증축·개축 애로 보도) - 다만 기사에 정확한 근거 고시명/날짜는
        명시되지 않음, 지구지정고시 자체의 효력으로 보임
      source: https://www.kyeongin.com/article/1739663
    - date: '2025-09-29'
      event: 환경영향평가서(초안) 공람 - 조성사업 단계, 지구지정과는 별개 절차
      source: https://www.suwon.go.kr/common-upload/upload/board/2025/9/29/4de4f9a7-ccca-4f95-a0d1-8712e1713226.pdf
    - date: 2026-07-01 ~ 07-02
      event: LH 경기남부지역본부 화성진안 보상설명회 개최
      source: https://www.newsis.com/view/NISX20260630_0003689360
    - date: '예정: 2027-06 조서작성 / 2027-12 보상계획 공고·열람 / 2028-02 감정평가사 선정 / 2028-04 감정평가
        / 2028-12 협의·계약'
      event: LH 발표 보상 일정 - 공식 보상계획 공고·열람은 2027-12로 아직 미도래, 즉 법정 보상 기준일이 별도 고시로 확정될
        시점도 아직 오지 않았다
      source: https://www.kyeongin.com/article/1766580
    - date: 판례
      event: 이주대책기준일은 원칙적으로 '(구역/지구지정에 관한) 주민공람 공고일'이며 사업계획·후보지 발표일이 아니라는 대법원 취지 -
        신통기획 사례에서도 '후보지 발표일이 아닌 공모/지정 관련 공식 절차일'을 기준일로 삼은 전례와 일치
      source: https://www.fnnews.com/news/202201161808476160
    open_questions_for_business_team:
    - 화성진안에 대해 국토교통부/화성시/LH가 관보에 게재되지 않은 별도 내부 공고로 '권리산정기준일' 또는 '이주대책기준일'을 고시한 적이
      있는가? (지구지정고시 원문 243페이지 전체를 확인했지만 해당 표현이 없었다 - 관보 밖 별도 공고 가능성만 남아있다)
    - 2022-02-21 전략환경영향평가 초안 공람일을 지구지정을 위한 주민공람공고일과 동일한 절차로 취급해도 되는가? (LH 원문상 지정제안~지구지정
      사이 유일한 주민 의견수렴 이벤트이므로 판례 원칙에는 가장 부합하지만, 법적 동일성은 사업부서 확인 필요)
    - 동일 절차로 볼 수 없다면 2024-02-07 지구지정고시일을 보상 기준일로 대체 적용해야 하는가, 아니면 2027-12 보상계획 공고·열람일까지
      REQ03 판정을 보류해야 하는가?
    not_a_substitute_for: '2026-09-08 조사는 뉴스·정책브리핑 등 2차 자료뿐이었으나, 2026-09-10에 지구지정고시
      원문(국토교통부고시 제2024-81호, 243p 전문)과 LH 환경영향평가서 초안 요약문(사업 추진경위 원문)을 직접 확보해 전문 텍스트로
      검색했다 - 즉 관보에 게재된 공개 문서 범위 내에서는 이제 원문 확인이 끝났다. 그럼에도 권리산정기준일을 명시한 문서를 찾지 못했으므로,
      남은 가능성은 관보 밖(LH 내부 게시판 등) 별도 공고뿐이다. business_confirmed를 true로 바꾸려면 사업부서가 그 별도
      공고 문서(있다면)를 근거로 제시하거나, 없음을 확인해줘야 한다.

      '
illegal_screening:
