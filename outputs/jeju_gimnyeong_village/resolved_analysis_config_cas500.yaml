project:
  id: jeju_gimnyeong_village
  name: 제주 구좌읍 김녕리 마을 위성영상 기반 변화탐지/불법건축물 스크리닝 데모
  short_name: 김녕리 마을
  official_name: 제주시 구좌읍 김녕리 (마을 중심부, 비공식 데모 AOI)
  location: 제주특별자치도 제주시 구좌읍 김녕리 일원
  official_area_m2: 360000
  operator: N/A (LH 공공주택지구 아님 - 실제 건물 밀집지역에서 불법건축물 스크리닝 로직을 검증하기 위한 데모)
  analysis_crs: EPSG:5179
satellite:
  provider: planetary-computer
  collection: sentinel-2-l2a
  bands:
  - B02
  - B03
  - B04
  - B08
  max_cloud_cover_pct: 20
  t1_date_range: 2022-01-01/2022-12-31
  t2_date_range: 2024-01-01/2024-12-31
  search_bbox_wgs84:
  - 126.74524363726029
  - 33.553772752455004
  - 126.75175508383074
  - 33.55922552448496
  known_limitation: '10m 해상도로 개별 단독주택 단위 신축/증축 탐지는 어려움. 대형 아파트단지/ 대규모 토지조성 등 큰 변화
    위주로 검증 후 SkyWatch Benchmark에서 고해상 상용영상과 비교한다.

    '
crs:
  source_crs: EPSG:4326
  analysis_crs: EPSG:5186
  decision_note: 'EPSG:5186 (Korea 2000 / Central Belt 2010, 중부원점, 중앙자오선 127E)을 선택.
    창릉 AOI 경도범위(126.87~126.91E)가 중부원점 적용범위(125.5~128.5E)에 들어가며, 국내 서울/경기 지역 공공 GIS
    데이터에서 가장 널리 쓰이는 표준 투영좌표계이기 때문. Sentinel-2 실측 확인: EPSG:32652 (WGS 84 / UTM zone
    52N), 10m, uint16, nodata=0. Raster Preprocessing 단계에서 EPSG:5186으로 재투영한다. NGII
    정사영상은 확보 후 별도로 원본 CRS를 확인한다.

    '
alignment:
  method: ECC
  max_allowed_rmse_m: 10.0
change_detection:
  methods:
  - robust_cva
  - ssim
  - edge_texture
  - ensemble
  min_area_thresholds_m2:
  - 10
  - 25
  - 50
  - 100
  threshold_method: fixed
  mask_threshold: 0.5
postprocess:
  morphology:
    opening_kernel: 3
    closing_kernel: 3
  min_component_area_m2: 25
spatial_statistics:
  k: 8
  permutations: 999
random_seed: 42
classification:
  buffer_distances_m:
  - 3
  - 5
  change_ratio_new_building_min: 0.5
priority_scoring:
  weights:
    change_confidence: 0.4
    change_ratio: 0.3
    administrative_uncertainty: 0.2
    building_relevance: 0.1
  thresholds:
    high: 0.7
    medium: 0.4
validation_sample:
  high_n: 50
  medium_n: 30
  low_n: 20
compensation:
  baseline_date: null
  baseline_type: N/A - LH 공공주택지구가 아니므로 보상기준일 개념 자체가 적용되지 않음
  business_confirmed: false
  interim_use_approved: false
  interim_use_note: 이 프로젝트는 REQ03(보상기준일 판정)을 의도적으로 건너뛴다.
illegal_screening:
  tolerance_ratio: 1.3
  strong_change_ratio: 0.5
  strong_confidence: 0.6
progress_monitor:
  grid_cell_size_m: 250.0
  site_persistence_distance_m: 30.0
imagery_tasking:
  recent_days_window: 90
  season_months:
  - 4
  - 6
field_survey:
  buffer_m_for_near_change: 3.0
reality_3d:
  review_buffer_m: 20.0
  floor_height_m: 3.0
  target_gsd_cm: 3.0
  overlap_pct: 75
arcgis_pro:
  output_gdb: outputs\jeju_gimnyeong_village\arcgis\jeju_gimnyeong_cas500.gdb
  template_aprx: outputs/arcgis/templates/blank_template.aprx
paths:
  data_root: data/projects/jeju_gimnyeong_village
  output_root: outputs/jeju_gimnyeong_village
  aoi: data/projects/jeju_gimnyeong_village/aoi/jeju_gimnyeong_village_aoi.gpkg
  buildings: data/projects/jeju_gimnyeong_village/processed/buildings.gpkg
  cadastre: data/projects/jeju_gimnyeong_village/processed/cadastre.gpkg
  building_register: data/projects/jeju_gimnyeong_village/raw/building_register/title_info.json
  building_permits: data/projects/jeju_gimnyeong_village/raw/building_permits/basic_outline.json
  output_gdb: outputs/jeju_gimnyeong_village/arcgis/jeju_gimnyeong_village.gdb
  output_aprx: outputs/jeju_gimnyeong_village/arcgis/jeju_gimnyeong_village.aprx
  reports: outputs/jeju_gimnyeong_village/reports
publishing:
  folder: skywatch_poc_jeju_gimnyeong_village
  web_map_title: 김녕리 마을 Building Change Intelligence - 불법건축물 스크리닝 데모
  sharing: private
  overwrite_existing: false
